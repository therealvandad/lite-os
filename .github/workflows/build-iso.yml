name: Build ISO
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - name: Build in Arch container
        run: |
          docker run --rm --privileged -v "$PWD:/src" -e OUT=/src/out archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm archiso grub
            bash /src/build.sh'
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: atlasos-iso
          path: out/
          compression-level: 0
          retention-days: 7
      - name: Split ISO for release (2 GiB asset limit)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out && sudo chown -R $USER . && iso=$(ls atlasos-*.iso)
          split -b 1900M -d "$iso" "$iso.part"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Download all `.part*` files, then join them:
            - Windows: `copy /b atlasos-*.iso.part00 + atlasos-*.iso.part01 + ... atlasos.iso`
            - Linux/macOS: `cat atlasos-*.iso.part* > atlasos.iso`
            Check against SHA256SUMS, then flash with Rufus (GPT/UEFI) or balenaEtcher.
          files: |
            out/atlasos-*.iso.part*
            out/SHA256SUMS
