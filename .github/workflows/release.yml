name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -ListAvailable -Name NuGet -ErrorAction SilentlyContinue | Where-Object { $_.Version -ge [version]'2.8.5.201' })) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      - name: Run tests before packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Normal'
          $result = Invoke-Pester -Configuration $cfg
          if ($result.Result -ne 'Passed') { exit 1 }

      - name: Build LiteOS-${{ github.ref_name }}.zip
        id: pkg
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          $name = "LiteOS-$tag"
          $stage = Join-Path $env:RUNNER_TEMP $name
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # payload: the Lite OS Builder (GUI + CLI), the image definition, the tweaks playbook, the catalog
          # and the docs - scripts and JSON only, no Windows files
          $payload = @('LiteOS-Builder.cmd', 'LiteOS-Builder.ps1', 'builder', 'image',
            'Start-LiteOS.cmd', 'LiteOS.ps1', 'Revert-LiteOS.ps1', 'src', 'tweaks', 'docs', 'README.md', 'LICENSE')
          foreach ($item in $payload) {
            if (-not (Test-Path -LiteralPath $item)) { throw "Payload item missing from the repo: $item" }
            Copy-Item -LiteralPath $item -Destination $stage -Recurse -Force
          }

          # never ship Windows images, binaries or keys: the user's PC downloads Windows from Microsoft
          $forbidden = @('.iso', '.wim', '.esd', '.swm', '.vhd', '.vhdx', '.cab', '.msu', '.msi', '.exe', '.dll', '.sys', '.appx', '.msix', '.efi')
          $bad = @(Get-ChildItem -LiteralPath $stage -Recurse -File | Where-Object { $forbidden -contains $_.Extension.ToLowerInvariant() })
          if ($bad.Count -gt 0) { throw ('Release payload contains binaries: ' + (($bad | ForEach-Object { $_.FullName.Substring($stage.Length) }) -join ', ')) }
          $sizeMB = [math]::Round(((Get-ChildItem -LiteralPath $stage -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 2)
          if ($sizeMB -gt 20) { throw "Release payload is $sizeMB MB - scripts only should be far smaller" }

          $zip = Join-Path (Get-Location) "$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $true)

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256" -Value "$hash  $name.zip" -Encoding ascii -NoNewline

          $beta = ''
          if ($tag -match '-') {
            $beta = "> **Beta.** Every change is built and checked automatically on GitHub (real Lite + Core ISOs, image verification), but installs on real PCs are still being tested. Try it in a virtual machine or on a spare drive first, and report problems in Issues.`n"
          }
          $notes = @"
          ## Lite OS $tag

          $beta

          Lite OS is a gaming Windows 11 (24H2 / 25H2, build 26100+) that you build yourself in one click.
          The **Lite OS Builder** downloads the official Windows 11 ISO from Microsoft on your PC and bakes the
          removals, tweaks, branding, Start / taskbar layout, Steam and the game runtimes into ``LiteOS.iso``.
          No Windows files, product keys or activators are included - bring your own license.

          ### Quick start (build Lite OS)
          1. Download ``$name.zip`` below.
          2. Right-click the zip > **Properties** > tick **Unblock** > **OK**.
          3. Extract it and double-click ``LiteOS-Builder.cmd``. Pick **Lite** (recommended) or **Core**, then **Build**.
          4. Flash ``LiteOS.iso`` to a USB stick with [Rufus](https://rufus.ie) and install. You pick the disk in Setup - nothing is wiped automatically.

          ### Lite OS Tweaks (your current Windows)
          Double-click ``Start-LiteOS.cmd`` and choose **1 - Balanced (recommended)**. A restore point and a backup are
          created first; ``Revert-LiteOS.ps1`` undoes the changes.

          Details: ``README.md``, ``docs/IMAGE.md`` and ``docs/TWEAKS.md`` inside the zip.

          ### Verify the download
          SHA256: ``$hash``

          ``````powershell
          (Get-FileHash .\$name.zip -Algorithm SHA256).Hash
          ``````

          Lite OS is not affiliated with or endorsed by Microsoft.
          "@
          Set-Content -LiteralPath 'release-notes.md' -Value $notes -Encoding utf8

          "zip=$name.zip" >> $env:GITHUB_OUTPUT
          "sha=$name.zip.sha256" >> $env:GITHUB_OUTPUT
          Write-Host "Built $name.zip  sha256=$hash"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Lite OS ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.sha }}
